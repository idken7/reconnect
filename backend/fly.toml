# Fly.io configuration for the Reconnect API.
# Run `fly deploy` from this directory. See docs/BACKEND.md for the full runbook.
#
# Secrets (never put these in this file):
#   fly secrets set DATABASE_URL=... PEPPER=... \
#       TWILIO_ACCOUNT_SID=... TWILIO_AUTH_TOKEN=... TWILIO_VERIFY_SERVICE_SID=...

app = "reconnect-api"          # change to your app name
primary_region = "iad"
kill_signal = "SIGTERM"        # the server shuts down gracefully on SIGTERM
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  TRUST_PROXY = "true"         # Fly sets Fly-Client-IP / X-Forwarded-*
  VERIFICATION_PROVIDER = "twilio"
  ALLOWED_ORIGINS = "https://reconnect.example"   # the static site origin(s), comma separated
  MIGRATIONS_DIR = "/app/migrations"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # The rate limiter is in-memory: run exactly ONE machine until it is moved to a shared store.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[deploy]
  strategy = "rolling"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
